<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moby Game Jam</title>
  <meta name="description" content="Moby Game Jam" />
  <link rel="icon" href="assets/whale.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" data-node-id="9:2">
    <!-- Contador de cuantos comio la ballena de cada cosa -->
    <div class="hud">
      <span class="hud__item"><img src="assets/croissant.png" alt="Medialunas comidas" /><span class="hud__count" data-count="croissant">0</span></span>
      <span class="hud__item"><img src="assets/coffee.svg" alt="Cafes comidos" /><span class="hud__count" data-count="coffee">0</span></span>
      <span class="hud__item"><img src="assets/logo.svg" alt="Logos comidos" /><span class="hud__count" data-count="logo">0</span></span>
      <span class="hud__item"><img src="assets/dumbbell.svg" alt="Mancuernas comidas" /><span class="hud__count" data-count="dumbbell">0</span></span>
    </div>

    <!-- Fondo que se desplaza solo, para dar sensacion de avance tipo
         side-scroller aunque la ballena este quieta -->
    <div class="bg-scroll bg-scroll--far" aria-hidden="true"></div>
    <div class="bg-scroll bg-scroll--near" aria-hidden="true"></div>

    <!-- Ellipse 2 — halo superior difuminado -->
    <img class="glow" src="assets/glow.svg" alt="" aria-hidden="true" data-node-id="20:6" />

    <!-- Untitled_Artwork 1 + ojos + boca -->
    <div class="whale" data-node-id="36:31">
      <!-- El cuerpo se estira cuando se abre la boca; envuelve a todas las
           capas para que ojos y boca acompanen al dibujo -->
      <div class="whale__body">
        <img class="whale__art" src="assets/whale.png" alt="Ballena de Moby Game Jam" data-node-id="20:21" />

        <!-- Cavidad y lengua. El labio superior lo pone el propio PNG. -->
        <svg class="whale__mouth" viewBox="0 0 432 408" aria-hidden="true" focusable="false">
          <defs>
            <clipPath id="moby-mouth-clip"><path d="" /></clipPath>
          </defs>
          <path class="whale__cavity" d="" />
          <g clip-path="url(#moby-mouth-clip)">
            <ellipse class="whale__tongue" cx="0" cy="0" rx="0" ry="0" />
          </g>
        </svg>

        <img class="whale__eye whale__eye--left" src="assets/eye-left.svg" alt="" aria-hidden="true" data-node-id="36:30" />
        <img class="whale__eye whale__eye--right" src="assets/eye-right.svg" alt="" aria-hidden="true" data-node-id="36:29" />
      </div>
    </div>

    <!-- Sticker de medialuna (94:220): borde blanco + dibujo.
         Las dos capas viven dentro del mismo contenedor comestible: la
         ballena se lo come al tocarlo (ver movement.js/feed.js). -->
    <div class="croissant" data-node-id="94:220">
      <img class="croissant__edge" src="assets/croissant-edge.svg" alt="" aria-hidden="true" data-node-id="94:221" />
      <img class="croissant__art" src="assets/croissant.png" alt="Medialuna" draggable="false" data-node-id="94:223" />
    </div>

    <!-- Stickers comestibles: la ballena tambien se los come al tocarlos -->
    <img class="sticker sticker--coffee" src="assets/coffee.svg" alt="" aria-hidden="true" data-node-id="93:177" />
    <img class="sticker sticker--logo" src="assets/logo.svg" alt="" aria-hidden="true" data-node-id="36:26" />

    <!-- Mancuerna: si la come, la ballena se achica (nunca por debajo del
         tamano inicial). Contrapesa el crecimiento de las medialunas. -->
    <img class="sticker sticker--dumbbell" src="assets/dumbbell.svg" alt="" aria-hidden="true" />
  </main>

  <!-- Pantalla de susto: aparece cuando la ballena come el logo 3 veces -->
  <div class="jumpscare" id="jumpscare" hidden>
    <img class="jumpscare__logo" src="assets/icbc.svg" alt="Logo de ICBC" />
    <p class="jumpscare__message">Perdiste tu d&iacute;a<br />intentando conectar a la VPN</p>
    <div class="sad-whale" aria-hidden="true">
      <img src="assets/whale.png" alt="" />
      <span class="sad-whale__tear sad-whale__tear--left"></span>
      <span class="sad-whale__tear sad-whale__tear--right"></span>
    </div>
    <p class="jumpscare__hint">Presion&aacute; <kbd>Enter</kbd> para comenzar de nuevo</p>
  </div>

  <!-- Escena del arponero: aparece cuando la ballena come 12 medialunas -->
  <div class="catch-scene" id="catchScene" hidden>
    <img class="catch-scene__harpoon" src="assets/harpoon.svg" alt="" aria-hidden="true" />
    <img class="catch-scene__harpooner" src="assets/harpooner.svg" alt="Arponero" />
    <div class="catch-scene__sign">
      <p class="catch-scene__message">Afloj&aacute;le a las harinas,<br />volv&eacute;s a empezar</p>
      <p class="catch-scene__hint">Presion&aacute; <kbd>Enter</kbd> para comenzar de nuevo</p>
    </div>
  </div>

  <script src="mouth.js"></script>
  <script src="eyes.js"></script>
  <script src="feed.js"></script>
  <script src="movement.js"></script>
</body>
</html>
